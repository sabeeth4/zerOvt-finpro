<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZerOvt Noise</title>

  <!-- satu CSS untuk semua halaman -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/noise.css">
</head>
<body>

  <main class="stage">

    <h1 class="audio-title">Which audio is soothing ?</h1>

    <!-- 4 kartu audio: gambar = <img>, teks ada di atas gambar -->
    <section class="audio-list">

      <article class="audio-card">
        <div class="audio-thumb">
          <img src="assets/ocean-audio.png" alt="Ocean">
        </div>
        <button class="btn btn-audio" type="button">
          <img class="icon-play" src="assets/Play.png" alt="">
          Start audio
        </button>
      </article>

      <article class="audio-card">
        <div class="audio-thumb">
          <img src="assets/night-audio.png" alt="Night Sky">
        </div>
        <button class="btn btn-audio" type="button">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 0.8 L9 5 L2 9.2 Z"/></svg>
          Start audio
        </button>
      </article>

      <article class="audio-card">
        <div class="audio-thumb">
          <img src="assets/rain-audio.png" alt="Rain">
        </div>
        <button class="btn btn-audio" type="button">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 0.8 L9 5 L2 9.2 Z"/></svg>
          Start audio
        </button>
      </article>

      <article class="audio-card">
        <div class="audio-thumb">
          <img src="assets/forest-audio.png" alt="Forest">
        </div>
        <button class="btn btn-audio" type="button">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 0.8 L9 5 L2 9.2 Z"/></svg>
          Start audio
        </button>
      </article>

    </section>

    <p class="audio-tagline">Take a break and listen to something calm.</p>

    <!-- Karakter -->
    <img class="char-audio char-Red-audio"    src="assets/Overthinking.png" alt="Overthinking">
    <img class="char-audio char-Green-audio"  src="assets/Anxious.png"      alt="Anxious">
    <img class="char-audio char-Pink-audio"   src="assets/Overwhelm.png"    alt="Overwhelm">
    <img class="char-audio char-yellow-audio" src="assets/Calm.png"         alt="Calm">
    <img class="char-audio char-Blue-audio"   src="assets/Heavy.png"        alt="Heavy">

    <!-- Awan (gambar) -->
    <div class="clouds" aria-hidden="true">
      <img class="cloud-img" src="assets/cloud-thought.png" alt="">
    </div>

  </main>

</body>
</html>
