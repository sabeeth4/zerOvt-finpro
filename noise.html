<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZerOvt Noise</title>

  <link rel="icon" type="image/x-icon" href="assets/zerOvt.png">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/noise.css">
</head>
<body>
  <nav id="navbar" data-variant="feature"></nav>
  <main class="stage">

    <h1 class="audio-title"><span style="color: var(--color-yellow);">Which</span> <span style="color: var(--color-green);">audio</span> <span style="color: var(--color-blue);">is</span> <span style="color: var(--color-pink);">soothing</span> <span style="color: var(--color-yellow);">?</span></h1>

    <!-- audio card -->
    <section class="audio-list">

      <article class="audio-card">
        <div class="audio-thumb">
          <img src="assets/ocean-audio.png" alt="Ocean">
        </div>
        <audio class="audio-player" src="assets/audio/ocean-audio.mp3" preload="none" loop></audio>
        <button class="btn btn-audio" type="button">
          <img class="icon-play" src="assets/Play.png" alt="">
          <span class="btn-label">Start audio</span>
        </button>
      </article>

      <article class="audio-card">
        <div class="audio-thumb">
          <img src="assets/night-audio.png" alt="Night Sky">
        </div>
        <audio class="audio-player" src="assets/audio/night-audio.mp3" preload="none" loop></audio>
        <button class="btn btn-audio" type="button">
          <img class="icon-play" src="assets/Play.png" alt="">
          <span class="btn-label">Start audio</span>
        </button>
      </article>

      <article class="audio-card">
        <div class="audio-thumb">
          <img src="assets/rain-audio.png" alt="Rain">
        </div>
        <audio class="audio-player" src="assets/audio/rain-audio.mp3" preload="none" loop></audio>
        <button class="btn btn-audio" type="button">
          <img class="icon-play" src="assets/Play.png" alt="">
          <span class="btn-label">Start audio</span>
        </button>
      </article>

      <article class="audio-card">
        <div class="audio-thumb">
          <img src="assets/forest-audio.png" alt="Forest">
        </div>
        <audio class="audio-player" src="assets/audio/forest-audio.mp3" preload="none" loop></audio>
        <button class="btn btn-audio" type="button">
          <img class="icon-play" src="assets/Play.png" alt="">
          <span class="btn-label">Start audio</span>
        </button>
      </article>

    </section>

    <p class="audio-tagline">Take a break and listen to something calm.</p>

    <img class="char-audio char-Red-audio"    src="assets/Overthinking.png" alt="Overthinking">
    <img class="char-audio char-Green-audio"  src="assets/Anxious.png"      alt="Anxious">
    <img class="char-audio char-Pink-audio"   src="assets/Overwhelm.png"    alt="Overwhelm">
    <img class="char-audio char-yellow-audio" src="assets/Calm.png"         alt="Calm">
    <img class="char-audio char-Blue-audio"   src="assets/Heavy.png"        alt="Heavy">

    <div class="clouds" aria-hidden="true">
      <img class="cloud-img" src="assets/Cloud-Pace.png" alt="">
    </div>

  </main>
  <script src="js/navbar.js"></script>
  <script src="js/noise.js"></script>
</body>
</html>
