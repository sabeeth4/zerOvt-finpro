<!DOCTYPE html>
<html lang="id" class="page-thoughts">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero Thoughts</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/thoughts.css">

  <style>
    html.page-thoughts {
      font-size: min(calc(100vw / 48.875), calc(100vh / 31.75), 30px) !important;
    }

    html.page-thoughts .char-yellow-thoughts {
      top: 24.4rem;
    }
  </style>
</head>
<body>
  <nav id="navbar" data-variant="feature"></nav>
  <main class="stage">

    <h1 class="title">Zero-thought</h1>
    <p class="desc">
      Dump all the random scenarios spinning in your head right now. No filter needed...
    </p>

    <section class="note">
      <textarea class="note-input" id="thought" maxlength="300" spellcheck="false" aria-label="Tulis pikiranmu di sini"></textarea>
      <span class="note-count" id="count">000/300</span>
    </section>

    <button class="btn-finish" type="button">Finish</button>

    <img class="char-thoughts char-Blue-thoughts"   src="assets/Heavy.png"        alt="Heavy">
    <img class="char-thoughts char-Red-thoughts"    src="assets/Overthinking.png" alt="Overthinking">
    <img class="char-thoughts char-Green-thoughts"  src="assets/Anxious.png"      alt="Anxious">
    <img class="char-thoughts char-yellow-thoughts" src="assets/Calm.png"         alt="Calm">
    <img class="char-thoughts char-Pink-thoughts"   src="assets/Overwhelm.png"    alt="Overwhelm">

    <div class="clouds" aria-hidden="true">
      <img class="cloud-img" src="assets/Cloud-Pace.png" alt="">
    </div>

  </main>

  <!-- pesawat kertas -->
  <img class="paper-plane" id="plane" src="assets/paper-plane.png" alt="" aria-hidden="true">

  <div class="popup" id="emptyPopup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <div class="popup-box">
      <h2 class="popup-title" id="popupTitle">Your paper is still empty</h2>
      <p class="popup-text">Write down what's on your mind first, then let it fly away.</p>
      <button class="popup-btn" id="popupClose" type="button">Okay</button>
    </div>
  </div>

  <script src="js/navbar.js"></script>
  <script>
    // hitung si jumlah huruf
    const input = document.getElementById('thought');
    const count = document.getElementById('count');

    function updateCount() {
      count.textContent = String(input.value.length).padStart(3, '0') + '/300';
    }
    input.addEventListener('input', updateCount);
    updateCount();

    // pesawat sama kertas kosong
    const finishBtn  = document.querySelector('.btn-finish');
    const plane      = document.getElementById('plane');
    const popup      = document.getElementById('emptyPopup');
    const popupClose = document.getElementById('popupClose');

    function openPopup()  { popup.classList.add('show'); popupClose.focus(); }
    function closePopup() { popup.classList.remove('show'); input.focus(); }

    finishBtn.addEventListener('click', function () {
      if (plane.classList.contains('fly')) return; 

      if (input.value.trim() === '') {
        openPopup();
        return;
      }

      plane.classList.add('fly');
      finishBtn.disabled = true;

      input.value = '';
      updateCount();      

    });

    plane.addEventListener('animationend', function () {
      plane.classList.remove('fly');
      finishBtn.disabled = false;
    });

    popupClose.addEventListener('click', closePopup);
    popup.addEventListener('click', function (e) { if (e.target === popup) closePopup(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && popup.classList.contains('show')) closePopup();
    });
  </script>

</body>
</html>
