<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZerOvt | Breathing</title>
    <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/Breathing.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
  </head>
<body>
    <main class="stage">
        <!-- bg bawah -->
        <div class="clouds" aria-hidden="true">
        <img class="Cloud-pace" src="assets/Cloud-pace.png" alt="Cloud Background">
        </div>

        <!-- char -->
        <img class="char char-yellow" src="assets/Calm.png"        alt="Calm">
        <img class="char char-Green"  src="assets/Anxious.png"     alt="Anxious">
        <img class="char char-Pink"   src="assets/Overwhelm.png"   alt="Overwhelm">
        <img class="char char-Blue"   src="assets/Heavy.png"       alt="Heavy">
        <img class="char char-Red"    src="assets/Overthinking.png" alt="Overthinking">

        <section class="breathe" id="home">
        <div class="breathe-ring" id="outer-circle">
            <div class="breathe-inner">
            <img class="breathe-mascot" src="" alt="">
            <h2 class="breathe-text" id="breathe-text">Breathe In</h2>
            <span class="breathe-dots">...</span>
            </div>
        </div>
        </section>
        <button class="btn btn-dark btn-exercise" id="start-btn" type="button">
            <i class="ri-play-fill"></i>
            Start Exercise
        </button>

    </main>

</body>
</html>
