<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZerOvt - no thoughts, just vibe.</title>
    <link rel="stylesheet" href="css/landing.css">
    <!-- google fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <a href="#home" class="nav-brand">
            <img src="assets/logo.png" alt="">
            <span class="logo-text">zerOvt</span>
        </a>

        <nav class="nav-menu">
            <a href="#home" class="nav-link">home</a>
            <a href="#about" class="nav-link">about</a>
            <a href="#features" class="nav-link">feature</a>
            <a href="#faq" class="nav-link">FAQ</a>
        </nav>
        
        <div class="nav-action">
          <button type="button" class="btn-get-started" onclick="location.href='#features'">get started</button>
        </div>
    </header>
    <!-- Main content -->
     <main>

        <!-- section slide 1; hero -->
         <section id="home" class="Hero-section">
           <h1 class="Hero-title">
            <span class="text-orange">how</span>
            <span class="text-green">are</span><br>
            <span class="text-blue">you</span>
            <span class="text-pink">today?</span>
           </h1>

           <div class="Heo-buttons">
            <button type="button" class="btn-primary">Clear my mind</button>
            <button type="button" class="btn-secondary">How it works →</button>
           </div>

           <!-- wadah ilustrasi -->
            <div class="Hero-visual">
             
                <div class="Hero-visual">
                    <!-- Awan -->
                    <img src="assets/awanbiru.png"
                        alt="" class="cloud-img cloud-back">

                    <img src="assets/awanputih.png"
                        alt="" class="cloud-img cloud-front">

                    <!-- Karakter -->
                    <img src="assets/Overthinking.png"
                        alt="" class="hero-char char-red">

                    <img src="assets/Calm.png"
                        alt="" class="hero-char char-yellow">

                    <img src="assets/Anxious.png"
                        alt="" class="hero-char char-green">

                    <img src="assets/Overwhelm.png"
                        alt="" class="hero-char char-pink">

                    <img src="assets/Heavy.png"
                        alt="" class="hero-char char-blue">

                    <!-- Zzz -->
                    <img src="assets/z 1.png"
                        alt="" class="zzz1">

                    <img src="assets/z (2).png"
                        alt="" class="zzz2">
               </div>

            </div>
         </section> 
         <!-- section 2 -->
          <section id="about" class="about-section">
            <div class="about-content">
                <h2 class="about-title">
                    <span class="about-word">
                        <span class="text-orange">a</span><span class="text-green">b</span><span class="text-blue">o</span><span class="text-pink">u</span><span class="text-red">t</span>
                    </span>
                    <span class="about-brand">zerOvt</span>
                </h2>
                 <p class="about-desc">
                    zerovt is your pocket-sized reset button for whenever life gets a little too loud. No sign-ups, no boring rules—just check your vibe, dump your thoughts, catch your breath, and tune out to good sounds.
                </p>
            </div>
          </section>

     </main>
</body>
